{% extends 'layout.html' %}
{% block title %}Ranking{% endblock %}

{% block content %}
    <h4>Ranking</h4>
    <table class="table table-borderless">
        <thead>
            <tr>
                <th>#</th>
                <th>Username</th>
                <th>Points</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.points }}</td>
        </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
