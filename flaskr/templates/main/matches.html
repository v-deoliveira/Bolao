{% extends 'layout.html' %}

{% block header %}
    <h2>{% block title %}Matches{% endblock %}</h2>
{% endblock %}

{% block content %}
    <div class="container mb-3 text-center">
        <form action="{{ url_for('main.matches') }}">
            <select class="form-select mx-auto w-auto" name="competition">
                {% for c in competitions %}
                    <option value="{{ c.id }}">{{ c.name }} {{ c.season }}</option>
                {% endfor %}
            </select>
            <button type="submit">Select</button>
        </form>
    </div>
    {% if matches %}
        <table class="table table-hover">
            <thead class="table-primary">
                <tr>
                    <th class="text-start">Home</th>
                    <th class="text-start">Score</th>
                    <th class="text-start">Away</th>
                    <th class="text-start">Time</th>
                    <th class="text-start">Status</th>
                    <th class="text-end"></th>
                </tr>
            </thead>
        </table>
    {% endif %}
{% endblock %}
