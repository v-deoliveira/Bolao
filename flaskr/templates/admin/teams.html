{% extends 'layout.html' %}

{% block header %}
    <h2>{% block title %}Teams management{% endblock %}</h2>
{% endblock %}

{% block content %}
    <h3>Create teams</h3>
    <form action="{{ url_for('admin_teams.create') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input name="team" autocomplete="off" id="team" placeholder="Team name" type="text">
        <button type="submit">Create</button>
    </form>

    {% if teams %}
            <table>
                <tbdoy>
                    {% for team in teams %}
                        <tr>
                            <td>{{ team.name }}</td>
                            <td>
                                <form action="{{ url_for('admin_teams.delete', id=team['id']) }}" method="POST">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                                    <button type="submit">Delete</button>
                                </form>
                            </td>
                        </tr>
                    {% endfor %}
                </tbdoy>
            </table>
    {% endif %}
{% endblock %}
