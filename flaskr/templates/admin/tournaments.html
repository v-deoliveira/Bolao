{% extends 'layout.html' %}

{% block header %}
    <h2>{% block title %}Tournaments management{% endblock %}</h2>
{% endblock %}

{% block content %}
    <h3>Create tournament</h3>
    <form action="{{ url_for('admin_tournaments.create') }}" method="post">
         <input name="tournament" autocomplete="off" id="tournament" placeholder="Tournament" type="text">
         <input name="season" autocomplete="off" id="season" placeholder="Season" type="text">
         <button type="submit">Submit</button>
    </form>
    <h3>Available Tournaments</h3>
    <table>
        <tbody>
            {% for t in tournaments %}
                <tr>
                    <td>{{ t.name }} {{ t.season }}</td>
                    <td>
                        <form action="{{ url_for('admin_tournaments.delete', id=t['id']) }}" method="POST">
                            <button type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock %}
