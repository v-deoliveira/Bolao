{% extends 'layout.html' %}

{% block title %} Make a bet {% endblock %}

{% block header %}{% endblock %}

{% block content %}
    <div class="container py-5 text-center">
        <h4>{{ match.home_team }} vs {{ match.away_team }}</h4>
        <form action="{{ url_for('predictions.make_bet', match_id=match['id']) }}" method="post">
            <div class="mb-3">
                <input class="form-control mx-auto w-auto" type="number" placeholder="Home Score" name="home_score" min="0" required>
            </div>
            <div class="mb-3">
                <input class="form-control mx-auto w-auto" type="number" placeholder="Away Score" name="away_score" min="0" required>
            </div>
            <button type="submit" class="btn btn-primary">Make Bet</button>
        </form>
    </div>
{% endblock %}
