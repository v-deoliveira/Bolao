{% extends 'layout.html' %}

{% block header %}

{% endblock %}

{% block content %}

        <li><a href="{{ url_for('admin_tournaments.index') }}">Tournaments</a></li>
        <li><a href="{{ url_for('admin_teams.index') }}">Teams</a></li>
